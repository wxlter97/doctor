<!doctype html>
<html lang="es-SV" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Apoyo para médicos en El Salvador: medicamentos por institución, calculadoras clínicas y planificador de turnos. Herramienta de apoyo; no sustituye el criterio médico." />
    <title>MedApoyo SV</title>
    <script>
      // Aplica tema y densidad antes del primer render para evitar parpadeo.
      try {
        var s = JSON.parse(localStorage.getItem('medapoyo.prefs') || '{}');
        var d = document.documentElement;
        if (s.theme === 'light' || s.theme === 'dark') d.dataset.theme = s.theme;
        if (s.density === 'compact') d.dataset.density = 'compact';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
